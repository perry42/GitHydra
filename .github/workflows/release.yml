# Implements specs/release-pipeline.md (FR-171-FR-178).
#
# Triggered only by pushing a version tag (vX.Y.Z) -- never by branch pushes or other tag
# shapes. The tag filter below uses GitHub Actions' extended-glob filter syntax (which does
# support `+` as "one or more of the preceding character", unlike a plain fnmatch glob), so
# it already excludes pre-release tags like "v1.0.0-rc1" without needing a separate check --
# see the "Filter pattern cheat sheet" in GitHub's workflow syntax docs.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Least-privilege default: only the `publish` job overrides this with the `contents: write`
# it actually needs for `gh release create`. Explicit here rather than relying on the repo/org
# default workflow-permissions setting, which isn't guaranteed read-only.
permissions:
  contents: read

jobs:
  # FR-172: the tag's version must exactly match packages/desktop/package.json's "version"
  # before any platform build runs, so a published installer's embedded ${version} (see
  # electron-builder.yml's artifactName) can never drift from the tag/Release it's attached to.
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./packages/desktop/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match packages/desktop/package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Tag version $TAG_VERSION matches package.json"

  # FR-173/FR-174: build the existing, unchanged electron-builder config on each target OS.
  build:
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: windows-installer
            artifact_path: packages/desktop/release/*.exe
          - os: macos-latest
            artifact_name: macos-installer
            artifact_path: packages/desktop/release/*.dmg
          - os: ubuntu-latest
            artifact_name: linux-installer
            artifact_path: |
              packages/desktop/release/*.AppImage
              packages/desktop/release/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build (git-core, then desktop)
        run: npm run build

      # AppImage packaging (not running one -- packaging one) needs libfuse2, which
      # ubuntu-latest's runner image stopped including by default. Diagnosed from the
      # "Package installer(s)" step failing only on the Linux leg, with a bare "exit code 1"
      # and no accessible detail beyond that (raw job logs require GitHub sign-in even on a
      # public repo, which this workflow's own automation can't do) -- this is the standard,
      # well-documented fix for that known gap, not a confirmed root cause from the actual
      # error text. If a future Linux-leg failure recurs after this, look elsewhere.
      - name: Install AppImage packaging dependency (libfuse2)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Package installer(s)
        id: package
        shell: bash
        run: |
          set -o pipefail
          DEBUG=electron-builder npm run package --workspace=packages/desktop 2>&1 | tee package-output.log

      # Diagnostic-only, temporary: raw Actions logs require GitHub sign-in even on a public
      # repo (confirmed while debugging the v0.1.0 release run), but the job summary renders
      # on the run's overview page without auth -- so surface the real failure text there
      # instead of guessing again. Remove once the Linux packaging failure is actually root-
      # caused and fixed, rather than leaving this as permanent workflow noise.
      - name: Surface packaging failure in the job summary
        if: failure() && steps.package.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "## Package installer(s) failed — ${{ matrix.os }}"
            echo '```'
            tail -c 8000 package-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  # FR-176/FR-177: only runs once all three platform builds succeed (via `needs`), so a
  # failed platform build never results in a partial Release being published.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-installer'
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## Unsigned builds

          These installers are not code-signed. That's a deliberate, documented tradeoff (see
          `ROADMAP.md`) -- not a build error -- so your OS will warn you on first launch:

          - **Windows:** SmartScreen will say "Windows protected your PC." Click
            **More info -> Run anyway**.
          - **macOS:** Gatekeeper will refuse to open the app. Right-click (or Control-click)
            the app and choose **Open**, then confirm in the dialog that appears. If that
            doesn't work, clear the quarantine attribute from a terminal:
            `xattr -cr /Applications/GitHydra.app`.

          Verify your download against `SHA256SUMS.txt` below if you'd like.
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            artifacts/*
