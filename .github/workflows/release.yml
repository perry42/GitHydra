# Implements specs/release-pipeline.md (FR-171-FR-178).
#
# Triggered only by pushing a version tag (vX.Y.Z) -- never by branch pushes or other tag
# shapes. The tag filter below uses GitHub Actions' extended-glob filter syntax (which does
# support `+` as "one or more of the preceding character", unlike a plain fnmatch glob), so
# it already excludes pre-release tags like "v1.0.0-rc1" without needing a separate check --
# see the "Filter pattern cheat sheet" in GitHub's workflow syntax docs.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Least-privilege default: only the `publish` job overrides this with the `contents: write`
# it actually needs for `gh release create`. Explicit here rather than relying on the repo/org
# default workflow-permissions setting, which isn't guaranteed read-only.
permissions:
  contents: read

jobs:
  # FR-172: the tag's version must exactly match packages/desktop/package.json's "version"
  # before any platform build runs, so a published installer's embedded ${version} (see
  # electron-builder.yml's artifactName) can never drift from the tag/Release it's attached to.
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify root/git-core/desktop package versions match
        run: node scripts/check-versions.mjs

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./packages/desktop/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match packages/desktop/package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Tag version $TAG_VERSION matches package.json"

  # FR-173/FR-174: build the existing, unchanged electron-builder config on each target OS.
  build:
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: windows-installer
            artifact_path: packages/desktop/release/*.exe
          - os: macos-latest
            artifact_name: macos-installer
            artifact_path: packages/desktop/release/*.dmg
          - os: ubuntu-latest
            artifact_name: linux-installer
            artifact_path: |
              packages/desktop/release/*.AppImage
              packages/desktop/release/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build (git-core, then desktop)
        run: npm run build

      # AppImage packaging (not running one -- packaging one) needs libfuse2, which
      # ubuntu-latest's runner image stopped including by default -- a real, separate gap from
      # the executableName fix below (electron-builder.yml), found the same day but unrelated:
      # this one would still bite even with executableName fixed.
      - name: Install AppImage packaging dependency (libfuse2)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Package installer(s)
        id: package
        shell: bash
        run: |
          set -o pipefail
          DEBUG=electron-builder npm run package --workspace=packages/desktop 2>&1 | tee package-output.log

      # Kept permanently, not just for this one bug: raw Actions logs require GitHub sign-in
      # even on a public repo (confirmed while debugging v0.1.0's first release run), so
      # without this, any future packaging failure -- on any platform, for any reason -- would
      # only be diagnosable by someone signed in manually digging through the UI. This surfaces
      # the real DEBUG=electron-builder output on the run's public overview page instead,
      # readable by anyone (signed in or not) who lands on the failed run.
      - name: Surface packaging failure in the job summary
        if: failure() && steps.package.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "## Package installer(s) failed — ${{ matrix.os }}"
            echo '```'
            tail -c 8000 package-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  # FR-176/FR-177: only runs once all three platform builds succeed (via `needs`), so a
  # failed platform build never results in a partial Release being published.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-installer'
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## What's new in v0.4.0

          **Worktrees.** Right-click any branch or commit to create a worktree, open it as a tab or in
          your editor (GitHydra finds the editors installed on your computer, and you can add your own),
          see all worktrees in the Branches panel, and remove one safely. New worktrees can copy the
          ignored files you need (`.env`, local config) from the one you are in, and "Copy ignored
          files here" does the same for a worktree that already exists. Secret-looking files are never
          ticked for you, and nothing is ever overwritten. A repository hook runs only after you confirm it.

          **Conflict editor.** Resolve conflicts block by block with Yours, Incoming, Both or Neither,
          jump between conflicts, and edit the result in place. Files with conflicts come first in Changes.

          **Edit in diff, multiple repositories.** Edit a file right inside its diff, with recovery drafts
          if the app closes unexpectedly, and keep several repositories open as tabs. The graph, branches
          and Changes list refresh on their own when git changes outside the app.

          **Tested on Windows, macOS and Linux.** Every change now runs the full test suite on all three,
          and the real app is driven by automated tests on Windows and Linux.

          ## Known limitations

          - On Linux the Changes list refreshes when you return to the window, not instantly while you
            work in another program.
          - Switching or removing an identity profile while a fetch/pull/push is already running
            can leave the displayed "current" identity out of step with the one that operation
            actually used. Nothing is lost or mis-authorized; re-check after it finishes.
          - Initializing a submodule from the worktree notice shows a command to copy; the button is
            not enabled yet.
          - No auto-update mechanism -- this is an explicit non-goal.
          - Requires git >= 2.24 on your PATH. Worktree listing is most robust on git 2.36 or newer.

          ## Unsigned builds

          These installers are not code-signed. That's a deliberate, documented tradeoff (see
          `ROADMAP.md`) -- not a build error -- so your OS will warn you on first launch:

          - **Windows:** SmartScreen will say "Windows protected your PC." Click
            **More info -> Run anyway**.
          - **macOS:** Gatekeeper will refuse to open the app. Right-click (or Control-click)
            the app and choose **Open**, then confirm in the dialog that appears. If that
            doesn't work, clear the quarantine attribute from a terminal:
            `xattr -cr /Applications/GitHydra.app`.

          Verify your download against `SHA256SUMS.txt` below if you'd like.
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            artifacts/*
