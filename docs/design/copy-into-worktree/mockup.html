<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copy ignored files here - design mockup (GitHydra)</title>
<style>
/* Tokens copied from packages/desktop/src/theme.css (DESIGN.md). Nothing new invented. Mockup chrome (.bar, .caption, .notes) is not product UI. */
:root, [data-theme="light"] {
  color-scheme: light;
  --gh-page:#f2f1ed; --gh-surface:#fff; --gh-ink-primary:#0b0b0b; --gh-ink-secondary:#52514e; --gh-ink-muted:#898781; --gh-ink-muted-text:#6a6862;
  --gh-gridline:#e1e0d9; --gh-baseline:#c3c2b7; --gh-border:rgba(11,11,11,.10); --gh-border-subtle:rgba(11,11,11,.05);
  --gh-accent:#2a78d6; --gh-accent-ink:#fff;
  --gh-serious-ink:#a8451a; --gh-good-ink:#0a7a0a; --gh-critical-ink:#b02a2a; --gh-warning-ink:#8c6003;
}
[data-theme="dark"] {
  color-scheme: dark;
  --gh-page:#0d0d0d; --gh-surface:#1a1a19; --gh-ink-primary:#fff; --gh-ink-secondary:#c3c2b7; --gh-ink-muted:#898781; --gh-ink-muted-text:#898781;
  --gh-gridline:#2c2c2a; --gh-baseline:#383835; --gh-border:rgba(255,255,255,.10); --gh-border-subtle:rgba(255,255,255,.05);
  --gh-accent:#3987e5; --gh-accent-ink:#fff;
  --gh-serious-ink:#ec835a; --gh-good-ink:#2fc22f; --gh-critical-ink:#ee7070; --gh-warning-ink:#fab219;
}
:root {
  --gh-status-good:#0ca30c; --gh-status-warning:#fab219; --gh-status-serious:#ec835a; --gh-status-critical:#d03b3b;
  --gh-lane-1:#2a78d6; --gh-lane-2:#eb6834; --gh-lane-3:#1baf7a;
  --gh-font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  --gh-font-mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
  --gh-space-1:4px; --gh-space-2:8px; --gh-space-3:12px; --gh-space-4:16px; --gh-space-5:24px; --gh-space-6:32px;
  --gh-radius-sm:4px; --gh-radius-pill:999px;
}
[data-theme="dark"] { --gh-lane-1:#3987e5; --gh-lane-2:#d95926; --gh-lane-3:#199e70; }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html { background:var(--gh-page); color:var(--gh-ink-primary); }
body { margin:0; font:13px/1.45 var(--gh-font-sans); }
button, input { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--gh-accent); outline-offset:1px; }
* { scrollbar-width:thin; scrollbar-color:var(--gh-baseline) transparent; }
.sr-only { position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.mono { font-family:var(--gh-font-mono); }
svg.i { width:14px; height:14px; flex:none; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
svg.i--18 { width:16px; height:16px; stroke-width:2; }
kbd { font:10px/1 var(--gh-font-mono); padding:2px 4px; border:1px solid color-mix(in srgb,currentColor 35%,transparent); border-radius:3px; }

/* ================= mockup chrome (not product UI) ================= */
.bar { position:sticky; top:0; z-index:200; background:var(--gh-surface); border-bottom:1px solid var(--gh-border); padding:8px 16px; display:flex; flex-wrap:wrap; gap:6px 18px; align-items:center; }
.bar h1 { margin:0; font-size:12px; font-weight:600; color:var(--gh-ink-secondary); }
.grp { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.grp > .lbl { font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--gh-ink-secondary); }
.seg { display:inline-flex; border:1px solid var(--gh-baseline); border-radius:var(--gh-radius-sm); overflow:hidden; background:var(--gh-surface); }
.seg button { border:0; background:transparent; padding:0 9px; height:26px; font-size:12px; cursor:pointer; border-right:1px solid var(--gh-baseline); white-space:nowrap; }
.seg button:last-child { border-right:0; }
.seg button:hover { background:var(--gh-gridline); }
.seg button[aria-pressed="true"] { background:var(--gh-accent); color:var(--gh-accent-ink); font-weight:600; }
.seg button:focus-visible { outline-offset:-2px; }
.page { padding:12px 16px 40px; max-width:1432px; margin:0 auto; }
.caption { margin:8px 0 0; font-size:12px; color:var(--gh-ink-secondary); max-width:130ch; min-height:2.9em; }
.caption b { color:var(--gh-ink-primary); font-weight:600; }
.keys { margin-top:6px; font-size:12px; color:var(--gh-ink-secondary); display:flex; gap:4px 16px; flex-wrap:wrap; }
.notes { margin-top:28px; border:1px solid var(--gh-border); border-radius:6px; background:var(--gh-surface); padding:16px 20px; }
.notes h2 { margin:0 0 8px; font-size:14px; }
.notes ul { margin:0; padding-left:18px; max-width:110ch; }
.notes li { margin:0 0 8px; color:var(--gh-ink-secondary); }
.notes li b { color:var(--gh-ink-primary); font-weight:600; }

/* ================= the app window ================= */
.win { position:relative; height:calc(100vh - 118px); min-height:640px; border:1px solid var(--gh-border); border-radius:6px; background:var(--gh-page); display:flex; flex-direction:column; overflow:hidden; }
.tabs { flex:none; height:34px; display:flex; align-items:flex-end; gap:2px; padding:0 8px; background:var(--gh-page); border-bottom:1px solid var(--gh-border); }
.tab { height:30px; display:flex; align-items:center; gap:8px; padding:0 14px; font-size:12px; color:var(--gh-ink-secondary); border:1px solid transparent; border-bottom:0; border-radius:4px 4px 0 0; }
.tab--on { background:var(--gh-surface); border-color:var(--gh-border); color:var(--gh-ink-primary); font-weight:600; position:relative; top:1px; }
.tab small { font-weight:400; color:var(--gh-ink-muted-text); font-size:11px; }
.body { flex:1; min-height:0; display:flex; }
.side { flex:none; width:310px; background:var(--gh-surface); border-right:1px solid var(--gh-border); overflow-y:auto; }
.main { flex:1; min-width:0; display:flex; flex-direction:column; background:var(--gh-page); }
.sec { display:flex; align-items:center; gap:6px; min-height:28px; padding:0 8px 0 8px; border-top:1px solid var(--gh-gridline); border-bottom:1px solid var(--gh-gridline); background:var(--gh-page); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--gh-ink-secondary); }
.sec:first-child { border-top:0; }
.sec h3 { margin:0; font:inherit; display:flex; align-items:center; gap:6px; flex:1; }
.sec .cnt { font-weight:400; color:var(--gh-ink-muted-text); }
.sec .tg { width:24px; height:24px; border:0; background:transparent; display:inline-flex; align-items:center; justify-content:center; border-radius:4px; color:var(--gh-ink-secondary); }
.sec .add { width:24px; height:24px; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--gh-border); border-radius:4px; color:var(--gh-ink-secondary); }
.blist, .wlist { list-style:none; margin:0; padding:0; }
.brow { display:flex; align-items:center; gap:8px; height:28px; padding:0 8px 0 12px; font-size:13px; }
.brow:hover { background:var(--gh-gridline); cursor:default; }
.brow .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.brow .gl { color:var(--gh-ink-secondary); display:inline-flex; }
.brow[aria-current="true"] .nm { font-weight:600; }
.brow:focus-visible { outline-offset:-2px; }
.wrow { display:flex; flex-direction:column; gap:2px; padding:8px 8px 8px 12px; border-bottom:1px solid var(--gh-border-subtle); min-width:0; position:relative; }
.wrow:last-child { border-bottom:0; }
.wrow:hover, .wrow.is-menu { background:var(--gh-gridline); }
.wrow:focus-visible { outline-offset:-2px; }
.wline { display:flex; align-items:center; gap:8px; min-width:0; }
.wline .gl { color:var(--gh-ink-secondary); display:inline-flex; flex:none; }
.wname { min-width:0; flex:0 1 auto; font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.wrow--muted .wname { color:var(--gh-ink-secondary); }
.wflag { flex:none; display:inline-flex; align-items:center; gap:4px; font-size:12px; line-height:16px; color:var(--gh-ink-muted-text); }
.wflag--locked, .wflag--missing { padding:0 6px; height:18px; border:1px solid var(--gh-border); border-radius:var(--gh-radius-pill); }
.wflag--locked { color:var(--gh-serious-ink); border-color:color-mix(in srgb,var(--gh-status-serious) 55%,var(--gh-border)); background:color-mix(in srgb,var(--gh-status-serious) 12%,var(--gh-surface)); }
.wflag--missing { color:var(--gh-critical-ink); border-color:color-mix(in srgb,var(--gh-status-critical) 55%,var(--gh-border)); background:color-mix(in srgb,var(--gh-status-critical) 12%,var(--gh-surface)); }
.wmore { margin-left:auto; flex:none; width:24px; height:24px; padding:0; display:inline-flex; align-items:center; justify-content:center; background:transparent; border:1px solid transparent; border-radius:4px; color:var(--gh-ink-secondary); cursor:pointer; }
.wmore:hover, .wmore[aria-expanded="true"] { color:var(--gh-ink-primary); border-color:var(--gh-accent); }
.wpath { font-size:12px; color:var(--gh-ink-muted-text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hint { margin:0; padding:6px 12px; font-size:12px; color:var(--gh-ink-muted-text); }

/* graph placeholder (background only) */
.graph { flex:1; min-height:0; position:relative; overflow:hidden; }
.graph svg { position:absolute; inset:0; width:100%; height:100%; }
.graph text { font:12px var(--gh-font-sans); fill:var(--gh-ink-secondary); }
.graph .sha { font:11px var(--gh-font-mono); fill:var(--gh-ink-muted-text); }

/* banners: icon + 10% tint + 1px border, no side stripe (DESIGN.md "uniform banner look") */
.gh-banner { --bs:var(--gh-baseline); --bi:var(--gh-ink-secondary); flex:none; display:flex; align-items:flex-start; gap:12px; padding:8px 16px; font-size:12px; line-height:18px; color:var(--gh-ink-primary); border-bottom:1px solid color-mix(in srgb,var(--bs) 45%,var(--gh-border)); border-top:1px solid color-mix(in srgb,var(--bs) 45%,var(--gh-border)); background:color-mix(in srgb,var(--bs) 10%,var(--gh-surface)); }
.gh-banner > svg.i { color:var(--bi); margin-top:2px; }
.gh-banner__text { flex:1; min-width:0; overflow-wrap:anywhere; }
.gh-banner--success { --bs:var(--gh-status-good); --bi:var(--gh-good-ink); }
.gh-banner--warning { --bs:var(--gh-status-warning); --bi:var(--gh-warning-ink); }
.gh-banner--critical { --bs:var(--gh-status-critical); --bi:var(--gh-critical-ink); }
.gh-banner code { font:12px var(--gh-font-mono); }
.qbtn { flex:none; height:24px; padding:0 8px; border:1px solid var(--gh-border); border-radius:var(--gh-radius-sm); background:transparent; color:var(--gh-ink-primary); font-size:12px; cursor:pointer; }
.qbtn:hover { background:var(--gh-gridline); }

/* context menu (ContextMenu.css) */
.gh-menu { position:absolute; z-index:60; min-width:236px; max-width:340px; background:var(--gh-surface); border:1px solid var(--gh-border); border-radius:var(--gh-radius-sm); box-shadow:0 8px 24px rgba(0,0,0,.24); padding:4px 0; }
.gh-menu__item { display:block; width:100%; text-align:left; padding:8px 12px; background:transparent; border:0; color:var(--gh-ink-primary); font-size:13px; cursor:pointer; }
.gh-menu__item:hover:not([aria-disabled="true"]), .gh-menu__item.is-hl:not([aria-disabled="true"]) { background:var(--gh-gridline); }
.gh-menu__item:focus-visible { outline:none; background:var(--gh-gridline); box-shadow:inset 0 0 0 2px var(--gh-accent); }
.gh-menu__item[aria-disabled="true"] { color:var(--gh-ink-muted-text); cursor:not-allowed; }
.gh-menu__item[aria-disabled="true"].is-hl { background:var(--gh-gridline); }
.gh-menu__desc { display:block; margin-top:2px; font-size:11px; color:var(--gh-ink-muted-text); }
.gh-menu__sep { height:1px; margin:4px 0; background:var(--gh-gridline); }
.gh-menu__row { display:flex; align-items:center; gap:8px; }
.gh-menu__row svg.i { color:var(--gh-ink-muted-text); }

/* overlays live inside the window */
.layer { position:absolute; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.4); padding:16px; }
.layer--menu { background:transparent; display:block; padding:0; z-index:55; }
.layer--pal { align-items:flex-start; padding-top:72px; }
.gh-dlg { width:min(540px,100%); max-height:100%; display:flex; flex-direction:column; background:var(--gh-surface); border:1px solid var(--gh-border); border-radius:var(--gh-radius-sm); box-shadow:0 16px 48px rgba(0,0,0,.32); }
.gh-dlg__body { padding:16px 16px 12px; overflow-y:auto; min-height:0; display:flex; flex-direction:column; gap:12px; }
.gh-dlg h2 { margin:0; font-size:14px; font-weight:600; }
.gh-dlg__foot { flex:none; display:flex; align-items:center; gap:8px; padding:12px 16px 16px; }
.gh-dlg__foot .readout { flex:1; min-width:0; margin:0; font-size:12px; color:var(--gh-ink-secondary); }
.gh-dlg__foot .readout.is-none { color:var(--gh-ink-muted-text); }
.gh-dlg > .gh-banner { border-left:0; border-right:0; }
.btn { height:30px; padding:0 12px; border-radius:var(--gh-radius-sm); border:1px solid var(--gh-border); background:var(--gh-page); color:var(--gh-ink-primary); font-size:12px; cursor:pointer; white-space:nowrap; }
.btn:hover { background:var(--gh-gridline); }
.btn--primary { background:var(--gh-accent); border-color:var(--gh-accent); color:var(--gh-accent-ink); }
.btn--primary:hover { background:color-mix(in srgb,var(--gh-accent) 88%,#000); }
.btn[aria-disabled="true"] { opacity:.5; cursor:not-allowed; }
.btn[aria-disabled="true"]:hover { background:var(--gh-page); }
.btn--primary[aria-disabled="true"]:hover { background:var(--gh-accent); }

/* from / into: layout A (two read-only rows) and layout B (one sentence) */
.route { margin:0; font-size:13px; }
.route b { font-weight:600; }
.route .pth { display:block; margin-top:2px; font-size:12px; color:var(--gh-ink-muted-text); overflow-wrap:anywhere; }
.rows2 { margin:0; display:grid; grid-template-columns:auto 1fr; gap:6px 12px; align-items:start; font-size:13px; }
.rows2 dt { color:var(--gh-ink-muted-text); font-size:12px; padding-top:1px; }
.rows2 dd { margin:0; min-width:0; }
.rows2 .l1 { display:flex; align-items:center; gap:6px; font-weight:600; }
.rows2 .l1 .gl { color:var(--gh-ink-secondary); display:inline-flex; }
.rows2 .l1 .flag { font-weight:400; font-size:12px; color:var(--gh-ink-muted-text); }
.rows2 .l2 { font-size:12px; color:var(--gh-ink-muted-text); overflow-wrap:anywhere; }

/* copy list (CopyIgnoredSection.css, same anatomy) */
.gh-copy { display:flex; flex-direction:column; align-items:flex-start; gap:4px; min-width:0; font-size:12px; }
.gh-copy__text { margin:0; display:flex; align-items:center; gap:4px; min-height:24px; color:var(--gh-ink-muted-text); }
.gh-copy__panel { align-self:stretch; display:flex; flex-direction:column; align-items:flex-start; gap:8px; padding:8px; border:1px solid var(--gh-border); border-radius:var(--gh-radius-sm); background:var(--gh-surface); min-width:0; }
.gh-copy__introrow { align-self:stretch; display:flex; align-items:flex-start; gap:8px; }
.gh-copy__intro { margin:0; flex:1; color:var(--gh-ink-secondary); line-height:1.5; }
.gh-copy__link { flex:none; min-height:24px; padding:0 4px; background:transparent; border:0; font-size:12px; color:var(--gh-accent); text-decoration:underline; cursor:pointer; }
.gh-copy__warning { align-self:stretch; margin:0; display:flex; align-items:flex-start; gap:4px; color:var(--gh-ink-primary); overflow-wrap:anywhere; }
.gh-copy__warning svg { color:var(--gh-serious-ink); margin-top:2px; }
.gh-copy__warning small { display:block; font-size:12px; color:var(--gh-ink-muted-text); margin-top:2px; }
.gh-copy__rows { align-self:stretch; list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
.gh-copy__row + .gh-copy__row { border-top:1px solid var(--gh-border); }
.gh-copy__rowlabel { display:flex; flex-wrap:wrap; align-items:center; gap:0 8px; min-height:28px; padding:2px 0; cursor:pointer; min-width:0; }
.gh-copy__rowlabel:hover { background:var(--gh-border-subtle); }
.gh-copy__rowlabel[data-disabled="true"] { cursor:default; }
.gh-copy__rowlabel[data-disabled="true"]:hover { background:transparent; }
.gh-copy__rowlabel input { width:16px; height:16px; margin:0 0 0 2px; accent-color:var(--gh-accent); flex:none; }
.gh-copy__rowlabel input:disabled { cursor:default; }
.gh-copy__name { overflow-wrap:anywhere; min-width:0; font:12px var(--gh-font-mono); }
.gh-copy__rowlabel[data-disabled="true"] .gh-copy__name { color:var(--gh-ink-muted-text); }
.gh-copy__tags { display:inline-flex; flex-wrap:wrap; gap:0 8px; }
.gh-copy__tag { display:inline-flex; align-items:center; gap:4px; color:var(--gh-ink-muted-text); }
.gh-copy__tag--warn { color:var(--gh-ink-primary); }
.gh-copy__tag--warn svg { color:var(--gh-serious-ink); }
.gh-copy__size { margin-left:auto; color:var(--gh-ink-muted-text); font-variant-numeric:tabular-nums; white-space:nowrap; }
.gh-copy__footer { margin:0; color:var(--gh-ink-muted-text); }
.gh-copy__bar { align-self:stretch; display:flex; justify-content:space-between; align-items:center; }
.prog { flex:1; min-width:60px; max-width:200px; height:4px; border-radius:2px; background:var(--gh-gridline); overflow:hidden; }
.prog > i { display:block; height:100%; background:var(--gh-accent); }
.gh-dlg__foot .readout.has-prog { display:flex; align-items:center; gap:10px; }

/* command palette (CommandPalette.css) */
.gh-pal { width:min(560px,100%); max-height:min(420px,100%); display:flex; flex-direction:column; overflow:hidden; background:var(--gh-surface); border:1px solid var(--gh-border); border-radius:var(--gh-radius-sm); box-shadow:0 16px 48px rgba(0,0,0,.32); }
.gh-pal__ctx { margin:0; padding:8px 16px 0; font-size:12px; color:var(--gh-ink-muted-text); }
.gh-pal__input { font-size:14px; background:var(--gh-surface); color:var(--gh-ink-primary); border:0; border-bottom:1px solid var(--gh-border); padding:12px 16px; outline:none; }
.gh-pal__input:focus-visible { box-shadow:inset 0 -2px 0 var(--gh-accent); }
.gh-pal__list { list-style:none; margin:0; padding:4px 0; overflow-y:auto; }
.gh-pal__item { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 16px; font-size:13px; cursor:pointer; }
.gh-pal__item:hover:not(.is-hl) { background:var(--gh-gridline); }
.gh-pal__item.is-hl { background:var(--gh-accent); color:var(--gh-accent-ink); }
.gh-pal__main { display:flex; flex-direction:column; min-width:0; }
.gh-pal__sub { font-size:12px; color:var(--gh-ink-muted-text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.gh-pal__item.is-hl .gh-pal__sub, .gh-pal__item.is-hl .gh-pal__why { color:var(--gh-accent-ink); opacity:.9; }
.gh-pal__item--off { cursor:not-allowed; }
.gh-pal__item--off .gh-pal__lab { opacity:.6; }
.gh-pal__why { flex:none; margin-left:auto; padding-left:12px; font-size:11px; color:var(--gh-ink-muted-text); text-align:right; }
.gh-pal__empty { padding:16px; font-size:12px; color:var(--gh-ink-muted-text); text-align:center; }
.gh-pal__foot { margin:0; padding:6px 16px; border-top:1px solid var(--gh-border); font-size:11px; color:var(--gh-ink-muted-text); display:flex; gap:14px; }
.gh-pal__lab { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.gh-pal__item .flagtxt { display:inline-flex; align-items:center; gap:4px; }
/* no entrance animation: the mockup re-renders on every key */
</style>
</head>
<body>
<div class="bar" role="region" aria-label="Mockup controls (not part of the product)">
  <h1>Mockup controls (not product UI)</h1>
  <div class="grp"><span class="lbl">Theme</span><div class="seg" id="themeSeg"><button data-theme-set="light" aria-pressed="true">Light</button><button data-theme-set="dark" aria-pressed="false">Dark</button></div></div>
  <div class="grp"><span class="lbl">State</span><div class="seg" id="stateSeg"></div></div>
  <div class="grp" id="varGrp" hidden><span class="lbl">Variant</span><div class="seg" id="varSeg"></div></div>
  <div class="grp"><span class="lbl">Dialog layout</span><div class="seg" id="laySeg"><button data-lay="sentence" aria-pressed="true">One sentence</button><button data-lay="rows" aria-pressed="false">Two rows</button></div></div>
</div>
<div class="page">
  <div class="win" id="win" aria-label="GitHydra window (mockup)"></div>
  <p class="caption" id="caption"></p>
  <div class="keys" aria-label="Keyboard"><span><kbd>Tab</kbd> / <kbd>Shift+Tab</kbd> move</span><span><kbd>Up</kbd> <kbd>Down</kbd> in lists and menus</span><span><kbd>Space</kbd> tick</span><span><kbd>Enter</kbd> primary action</span><span><kbd>Esc</kbd> cancel / back</span><span><kbd>Ctrl+K</kbd> palette</span><span><kbd>Shift+F10</kbd> menu on a worktree row</span></div>
  <section class="notes" aria-labelledby="dq"><h2 id="dq">Decisions and open questions</h2><ul id="dqList"></ul></section>
</div>

<script>
"use strict";

  const pick = p.step === 'pick';
  return `<div class="layer layer--pal" data-scrim="pal"><div class="gh-pal" role="dialog" aria-modal="true" aria-label="${pick ? 'Choose a worktree to copy into' : 'Command Palette'}">
    ${pick ? `<p class="gh-pal__ctx">Copy ignored files from <b>${esc(SRC.folder)}</b> into which worktree?</p>` : ''}
    <input class="gh-pal__input" data-f="pi" role="combobox" aria-expanded="true" aria-controls="pl" aria-activedescendant="po-${p.hl}" aria-autocomplete="list" placeholder="${pick ? 'Choose a worktree' : 'Type a command'}" value="${esc(p.q)}" autocomplete="off" spellcheck="false">
    <ul class="gh-pal__list" id="pl" role="listbox" aria-label="${pick ? 'Worktrees' : 'Commands'}">${lis || '<li class="gh-pal__empty">No matching ' + (pick ? 'worktrees' : 'commands') + '</li>'}</ul>
    <p class="gh-pal__foot"><span><kbd>Up</kbd> <kbd>Down</kbd> move</span><span><kbd>Enter</kbd> ${pick ? 'choose' : 'run'}</span><span><kbd>Esc</kbd> ${pick ? 'back' : 'close'}</span></p></div></div>`;
}
function layersHTML() { return menuHTML() + (S.dlg ? dialogHTML() : '') + palHTML(); }

/* ---------- render + focus ---------- */
function render(focusId) {
  const prev = focusId || (document.activeElement && document.activeElement.dataset && document.activeElement.dataset.f);
  const pi = document.querySelector('.gh-pal__input'), caret = pi && document.activeElement === pi ? pi.selectionStart : null;
  const win = document.getElementById('win');
  win.innerHTML = winHTML();
  if (prev) { const el = win.querySelector(`[data-f="${prev}"]`); if (el) { el.focus({ preventScroll:true }); if (caret != null && el.classList.contains('gh-pal__input')) el.setSelectionRange(caret, caret); } }
  document.getElementById('caption').innerHTML = CAPTIONS[S.state];
}
const focusRet = () => { const id = S.ret; S.ret = null; if (id) { const el = document.querySelector(`[data-f="${id}"]`); if (el) el.focus(); } };

/* ---------- state machine ---------- */
function newDlg(dest, o = {}) {
  const cands = o.zero ? [] : CANDS.map(c => ({ ...c }));
  return { dest, cands, ticks:new Set(cands.filter(c => c.on).map(c => c.id)), showAll:false, rf:null, run:null, err:null, ...o };
}
function openMenuAt(wid, kind, hlLast) {
  const anchorEl = document.querySelector(kind === 'br' ? `[data-b="${wid}"]` : `[data-more="${wid}"]`);
  const wr = document.getElementById('win').getBoundingClientRect(), ar = anchorEl.getBoundingClientRect();
  const items = menuItems({ wt:wid, kind }).filter(i => !i.sep);
  S.menu = { wt:wid, kind, anchor:(kind === 'br' ? 'b-' : 'w-') + wid, x:Math.round(ar.right - wr.left + (kind === 'br' ? 6 : 8) - (kind === 'br' ? 30 : 0)), y:Math.round(ar.top - wr.top - (kind === 'br' ? 0 : 4)), hl:hlLast ? items.findIndex(i => i.id === 'copy') : 0 };
  S.menu.x = Math.max(S.menu.x, 322);
}
function clearLayers() { clearInterval(S.timer); S.menu = S.dlg = S.pal = null; }
function setState(n, v) {
  clearLayers(); S.state = n; S.banner = null;
  const def = STATES.find(s => s[0] === n)[2];
  S.variant[n] = v || (def ? def[0][0] : null); v = S.variant[n]; S.ret = null;
  S.rowFocus = 'tour';
  render(); // base first so anchors exist for menu geometry
  if (n === 1) { openMenuAt(v === 'br' ? 'tour' : 'tour', v, true); }
  if (n === 2) S.dlg = newDlg('tour');
  if (n === 3) { S.dlg = newDlg('tour'); S.dlg.ticks.add('env'); }
  if (n === 4) S.dlg = newDlg('tour', { zero:true });
  if (n === 5) {
    if (v === 'locked') openMenuAt('rel', 'wt', true);
    if (v === 'missing') openMenuAt('spike', 'wt', true);
    if (v === 'source') openMenuAt('acme', 'wt', true);
    if (v === 'pal') S.pal = { step:'cmd', q:'copy ign', hl:0 };
  }
  if (n === 6) S.pal = { step:v === 'pick' ? 'pick' : 'cmd', q:v === 'pick' ? '' : 'copy ign', hl:0 };
  if (n === 7) S.banner = v === 'ok'
    ? { tone:'success', html:'Copied 3 files (4 KB) from <b>acme</b> into <b>tour-login</b>.' }
    : { tone:'warning', html:'Copied 2 files (4 KB) from <b>acme</b> into <b>tour-login</b>. Not copied: <code>config/local.json</code> (already exists), <code>data/seed.sqlite</code> (changed since you reviewed).' };
  if (n === 8) {
    S.dlg = newDlg('tour'); S.dlg.ticks.add('nm');
    if (v === 'run') S.dlg.run = { done:7310 };
    else S.dlg.err = 'tour-login is no longer a worktree of this repository.';
  }
  render(initialFocus());
  const g = document.getElementById('varGrp'), seg = document.getElementById('varSeg');
  if (def) { g.hidden = false; seg.innerHTML = def.map(([k, l]) => `<button data-var="${k}" aria-pressed="${k === v}">${l}</button>`).join(''); } else g.hidden = true;
  document.querySelectorAll('#stateSeg button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.state === n)));
}
function initialFocus() {
  if (S.menu) return 'mi-' + S.menu.hl;
  if (S.pal) return 'pi';
  if (S.dlg) return S.dlg.run ? 'cancel' : S.dlg.cands.length === 0 ? 'cancel' : (S.dlg.err ? 'go' : 'row-' + S.dlg.cands.find(c => !c.exists).id);
  return null;
}
function closeDlg() { clearInterval(S.timer); S.dlg = null; render(); focusRet(); }
function runCopy() {
  const d = S.dlg, t = totals(); if (!t.rows) return;
  d.err = null; d.run = { done:0 };
  render('cancel');
  const exists = d.cands.filter(c => c.exists).map(c => c.name);
  S.timer = setInterval(() => {
    d.run.done = Math.min(t.n, d.run.done + Math.max(1, Math.ceil(t.n / 24)));
    if (d.run.done >= t.n) {
      clearInterval(S.timer); const dest = wt(d.dest);
      S.dlg = null; S.state = 7;
      S.banner = exists.length
        ? { tone:'warning', html:`Copied ${plural(t.n, 'file')} (${fmtSize(t.b)}) from <b>${SRC.folder}</b> into <b>${dest.folder}</b>. Not copied: <code>${esc(exists.join(', '))}</code> (already exists).` }
        : { tone:'success', html:`Copied ${plural(t.n, 'file')} (${fmtSize(t.b)}) from <b>${SRC.folder}</b> into <b>${dest.folder}</b>.` };
      render(); focusRet(); syncBar();
    } else render('cancel');
  }, 140);
}
function cancelRun() {
  const d = S.dlg; clearInterval(S.timer);
  const done = d.run.done, dest = wt(d.dest);
  S.dlg = null; S.banner = { tone:'warning', html:`Copy cancelled. ${plural(done, 'file')} already copied into <b>${dest.folder}</b> stay there.` };
  render(); focusRet();
}
function syncBar() { document.querySelectorAll('#stateSeg button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.state === S.state))); const def = STATES.find(s => s[0] === S.state)[2]; document.getElementById('varGrp').hidden = !def; if (def) document.getElementById('varSeg').innerHTML = def.map(([k, l]) => `<button data-var="${k}" aria-pressed="${k === S.variant[S.state]}">${l}</button>`).join(''); }

function chooseMenuItem(it) {
  if (it.disabled) return;
  const m = S.menu; S.menu = null;
  if (it.id === 'copy') { S.ret = 'w-' + m.wt; S.dlg = newDlg(m.wt); render(initialFocus()); return; }
  render(m.kind === 'br' ? 'b-' + m.wt : 'w-' + m.wt);
}
function chooseWorktree(id) {
  const w = wt(id); if (refusal(w)) return;
  S.ret = null; S.pal = null; S.dlg = newDlg(id); render(initialFocus());
}

/* ---------- events ---------- */
const win = document.getElementById('win');
win.addEventListener('click', e => {
  const t = e.target;
  const more = t.closest('[data-more]'); if (more) { e.stopPropagation(); S.ret = 'w-' + more.dataset.more; openMenuAt(more.dataset.more, 'wt', false); S.menu.hl = 0; render('mi-' + S.menu.hl); return; }
  const mi = t.closest('[data-mi]'); if (mi) { const items = menuItems(S.menu).filter(i => !i.sep); chooseMenuItem(items[+mi.dataset.mi]); return; }
  const act = t.closest('[data-act]');
  if (act) {
    const a = act.dataset.act;
    if (a === 'dismiss') { S.banner = null; render(); return; }
    if (a === 'cancel') { S.dlg.run ? cancelRun() : closeDlg(); return; }
    if (a === 'none') { S.dlg.ticks.clear(); render('none'); const n = win.querySelector('[data-f="row-' + S.dlg.cands.find(c => !c.exists).id + '"]'); if (n) n.focus(); return; }
    if (a === 'all') { S.dlg.showAll = !S.dlg.showAll; render('all'); return; }
    if (a === 'go') { if (act.getAttribute('aria-disabled') !== 'true') runCopy(); return; }
  }
  const po = t.closest('[data-po]'); if (po) { S.pal.hl = +po.dataset.po; palEnter(); return; }
  if (t.dataset.scrim === 'menu') { S.menu = null; render(); focusRet(); return; }
  if (t.dataset.scrim === 'pal') { S.pal = null; render(); return; }
});
win.addEventListener('contextmenu', e => {
  const r = e.target.closest('[data-w]'), b = e.target.closest('[data-b]');
  if (r || b) { e.preventDefault(); const id = (r || b).dataset.w || (r || b).dataset.b; S.ret = (r ? 'w-' : 'b-') + id; openMenuAt(id, r ? 'wt' : 'br', false); S.menu.hl = 0; render('mi-0'); }
});
win.addEventListener('change', e => {
  const r = e.target.dataset && e.target.dataset.row; if (!r) return;
  const t = S.dlg.ticks; e.target.checked ? t.add(r) : t.delete(r); S.dlg.rf = r; render('row-' + r);
});
win.addEventListener('input', e => { if (e.target.classList.contains('gh-pal__input')) { S.pal.q = e.target.value; S.pal.hl = 0; render('pi'); } });
function palEnter() {
  const items = palItems(), it = items[S.pal.hl]; if (!it || it.off) return;
  if (S.pal.step === 'cmd') { if (it.id === 'copy') { S.pal = { step:'pick', q:'', hl:0 }; render('pi'); } else { S.pal = null; render(); } }
  else chooseWorktree(it.id);
}
win.addEventListener('keydown', e => {
  const k = e.key, t = e.target;
  /* Shift+F10 / ContextMenu / Enter on a worktree row */
  if ((k === 'F10' && e.shiftKey) || k === 'ContextMenu' || (k === 'Enter' && t.matches && t.matches('.wrow'))) {
    const r = t.closest('[data-w]'); if (r) { e.preventDefault(); S.ret = 'w-' + r.dataset.w; openMenuAt(r.dataset.w, 'wt', false); S.menu.hl = 0; render('mi-0'); return; }
    const b = t.closest('[data-b]'); if (b) { e.preventDefault(); S.ret = 'b-' + b.dataset.b; openMenuAt(b.dataset.b, 'br', false); S.menu.hl = 0; render('mi-0'); return; }
  }
  if (S.pal) {
    const items = palItems();
    if (k === 'ArrowDown') { e.preventDefault(); S.pal.hl = Math.min(items.length - 1, S.pal.hl + 1); render('pi'); }
    else if (k === 'ArrowUp') { e.preventDefault(); S.pal.hl = Math.max(0, S.pal.hl - 1); render('pi'); }
    else if (k === 'Enter') { e.preventDefault(); palEnter(); }
    else if (k === 'Escape') { e.preventDefault(); e.stopPropagation(); if (S.pal.step === 'pick' && S.variant[6] !== 'pick') { S.pal = { step:'cmd', q:'copy ign', hl:0 }; render('pi'); } else if (S.pal.step === 'pick') { S.pal = { step:'cmd', q:'copy ign', hl:0 }; render('pi'); } else { S.pal = null; render(); } }
    else if (k === 'Tab') e.preventDefault();
    return;
  }
  if (S.menu) {
    const items = menuItems(S.menu).filter(i => !i.sep), m = S.menu;
    if (k === 'ArrowDown') { e.preventDefault(); m.hl = (m.hl + 1) % items.length; render('mi-' + m.hl); }
    else if (k === 'ArrowUp') { e.preventDefault(); m.hl = (m.hl - 1 + items.length) % items.length; render('mi-' + m.hl); }
    else if (k === 'Home') { e.preventDefault(); m.hl = 0; render('mi-0'); }
    else if (k === 'End') { e.preventDefault(); m.hl = items.length - 1; render('mi-' + m.hl); }
    else if (k === 'Enter' || k === ' ') { e.preventDefault(); chooseMenuItem(items[m.hl]); }
    else if (k === 'Escape' || k === 'Tab') { e.preventDefault(); S.menu = null; render(); focusRet(); }
    return;
  }
  if (S.dlg) {
    const d = S.dlg;
    if (k === 'Escape') { e.preventDefault(); d.run ? cancelRun() : closeDlg(); return; }
    if (k === 'Tab') {
      const f = [...win.querySelectorAll('.gh-dlg button:not([aria-disabled="true"]):not([disabled]), .gh-dlg input:not([disabled])')].filter(x => x.tabIndex >= 0);
      if (!f.length) { e.preventDefault(); return; }
      const i = f.indexOf(t);
      if (e.shiftKey && (i <= 0)) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && (i === f.length - 1 || i < 0)) { e.preventDefault(); f[0].focus(); }
      return;
    }
    if (t.dataset && t.dataset.row && (k === 'ArrowDown' || k === 'ArrowUp' || k === 'Home' || k === 'End')) {
      e.preventDefault();
      const boxes = [...win.querySelectorAll('input[data-row]:not([disabled])')], i = boxes.indexOf(t);
      const n = k === 'Home' ? 0 : k === 'End' ? boxes.length - 1 : Math.max(0, Math.min(boxes.length - 1, i + (k === 'ArrowDown' ? 1 : -1)));
      boxes.forEach((b, j) => b.tabIndex = j === n ? 0 : -1); d.rf = boxes[n].dataset.row; boxes[n].focus(); return;
    }
    if (k === 'Enter' && !(t.tagName === 'BUTTON')) { e.preventDefault(); if (d.cands.length === 0) closeDlg(); else if (!d.run) runCopy(); }
    return;
  }
  if (t.matches && t.matches('.wrow') && (k === 'ArrowDown' || k === 'ArrowUp')) {
    e.preventDefault(); const rows = [...win.querySelectorAll('.wrow')], i = rows.indexOf(t), n = rows[Math.max(0, Math.min(rows.length - 1, i + (k === 'ArrowDown' ? 1 : -1)))];
    S.rowFocus = n.dataset.w; rows.forEach(r => r.tabIndex = r === n ? 0 : -1); n.focus();
  }
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); clearLayers(); S.pal = { step:'cmd', q:'', hl:0 }; S.ret = null; render('pi'); }
});

/* ---------- bar ---------- */
document.getElementById('stateSeg').innerHTML = STATES.map(s => `<button data-state="${s[0]}" aria-pressed="false">${s[0]} ${s[1]}</button>`).join('');
document.querySelector('.bar').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.state) setState(+b.dataset.state);
  else if (b.dataset.var) setState(S.state, b.dataset.var);
  else if (b.dataset.themeSet) { S.theme = b.dataset.themeSet; document.documentElement.dataset.theme = S.theme; document.querySelectorAll('#themeSeg button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); }
  else if (b.dataset.lay) { S.layout = b.dataset.lay; document.querySelectorAll('#laySeg button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); render(); }
});
/* ?s=3&v=part&t=dark&l=rows for screenshots */
const q = new URLSearchParams(location.search);
if (q.get('t')) document.querySelector(`[data-theme-set="${q.get('t')}"]`).click();
if (q.get('l')) document.querySelector(`[data-lay="${q.get('l')}"]`).click();
setState(+(q.get('s') || 1), q.get('v') || undefined);
</script>
</body>
</html>
